name: terraform-environment-deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan, apply, or destroy
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
        required: true
      operation:
        description: Create or apply a normal/destroy plan
        type: choice
        options:
          - plan
          - apply
          - destroy-plan
          - destroy-apply
        default: plan
        required: true
      plan_run_id:
        description: Successful matching plan run ID (required for apply operations)
        type: string
        required: false
      confirmation:
        description: Enter destroy-ENVIRONMENT for destroy-apply; leave blank otherwise
        type: string
        required: false

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
  TF_ROOT: terraform/environments/${{ inputs.environment }}
  TF_STATE_KEY: environments/${{ inputs.environment }}/terraform.tfstate

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && (inputs.operation == 'plan' || inputs.operation == 'destroy-plan')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.16.1, terraform_wrapper: false}
      - uses: terraform-linters/setup-tflint@v5
        with: {tflint_version: v0.58.1}
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-${{ inputs.environment }}-plan

      - name: Validate dispatch and AWS identity
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          test -n "${{ vars.AWS_REGION }}"
          aws sts get-caller-identity
      - name: Materialize environment variables
        env:
          TERRAFORM_TFVARS: ${{ secrets.TERRAFORM_TFVARS }}
        run: |
          test -n "${TERRAFORM_TFVARS}"
          printf '%s\n' "${TERRAFORM_TFVARS}" > "${TF_ROOT}/terraform.tfvars"
          chmod 600 "${TF_ROOT}/terraform.tfvars"
      - name: Resolve pipeline-managed DuckDNS and certificate variables
        run: |
          set -Eeuo pipefail
          case "${DEPLOY_ENVIRONMENT}" in
            dev) subdomain=fred-rag-dev ;;
            staging) subdomain=fred-rag-stage ;;
            prod) subdomain=fred-rag ;;
            *) echo "Unsupported environment: ${DEPLOY_ENVIRONMENT}" >&2; exit 2 ;;
          esac
          domain_name="${subdomain}.duckdns.org"
          parameter_name="/rag-platform/${DEPLOY_ENVIRONMENT}/letsencrypt/acm_certificate_arn"
          certificate_arn=$(aws ssm get-parameter \
            --name "${parameter_name}" \
            --query Parameter.Value --output text 2>/dev/null || true)
          if [[ ! "${certificate_arn}" =~ ^arn:aws:acm:${{ vars.AWS_REGION }}:[0-9]{12}:certificate/.+ ]]; then
            echo "No pipeline-managed certificate is registered for ${domain_name}. Run the DuckDNS certificate workflow first." >&2
            exit 2
          fi
          read -r actual_domain status < <(aws acm describe-certificate \
            --certificate-arn "${certificate_arn}" \
            --query 'Certificate.[DomainName,Status]' --output text)
          if [[ "${actual_domain}" != "${domain_name}" || "${status}" != "ISSUED" ]]; then
            echo "Certificate is not usable for ${domain_name}: domain=${actual_domain} status=${status}" >&2
            exit 2
          fi
          jq -n \
            --arg domain_name "${domain_name}" \
            --arg certificate_arn "${certificate_arn}" \
            '{
              enable_https: true,
              enable_duckdns: true,
              domain_name: $domain_name,
              hosted_zone_id: null,
              certificate_arn: $certificate_arn
            }' > "${TF_ROOT}/zz-pipeline.auto.tfvars.json"
      - name: Initialize remote state
        run: |
          terraform -chdir="${TF_ROOT}" init -reconfigure -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Format and validate
        run: |
          terraform fmt -check -recursive terraform
          terraform -chdir="${TF_ROOT}" validate
          tflint --recursive
      - name: Checkov
        run: |
          python -m pip install checkov==3.3.16
          checkov -d terraform --framework terraform --compact
      - name: Create saved plan
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          plan_kind="apply"
          plan_args=()
          if [[ "${OPERATION}" == "destroy-plan" ]]; then
            plan_kind="destroy"
            plan_args+=("-destroy")
          fi
          terraform -chdir="${TF_ROOT}" plan "${plan_args[@]}" \
            -input=false -lock-timeout=5m -out=tfplan
          terraform -chdir="${TF_ROOT}" show -no-color tfplan > "${GITHUB_WORKSPACE}/plan.txt"
          sha256sum "${TF_ROOT}/tfplan" > "${GITHUB_WORKSPACE}/tfplan.sha256"
          printf '%s\n' "${GITHUB_SHA}" > "${GITHUB_WORKSPACE}/commit.sha"
          printf '%s\n' "${plan_kind}" > "${GITHUB_WORKSPACE}/plan.kind"
          printf '%s\n' "${DEPLOY_ENVIRONMENT}" > "${GITHUB_WORKSPACE}/plan.environment"
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-${{ inputs.environment }}-plan-${{ github.run_id }}
          path: |
            terraform/environments/${{ inputs.environment }}/tfplan
            plan.txt
            tfplan.sha256
            commit.sha
            plan.kind
            plan.environment
          if-no-files-found: error
          retention-days: 5

  apply:
    if: github.ref == 'refs/heads/main' && (inputs.operation == 'apply' || inputs.operation == 'destroy-apply')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Verify source plan run
        id: source
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          if [[ ! "${PLAN_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "plan_run_id must be the numeric ID of a successful plan run" >&2
            exit 1
          fi
          if [[ "${OPERATION}" == "destroy-apply" && "${CONFIRMATION}" != "destroy-${DEPLOY_ENVIRONMENT}" ]]; then
            echo "destroy-apply requires the exact confirmation destroy-${DEPLOY_ENVIRONMENT}" >&2
            exit 1
          fi
          if [[ "${OPERATION}" == "apply" && -n "${CONFIRMATION}" ]]; then
            echo "confirmation must be blank for a normal apply" >&2
            exit 1
          fi
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}")"
          test "$(jq -r .path <<<"${run_json}")" = ".github/workflows/terraform-deploy.yml"
          test "$(jq -r .event <<<"${run_json}")" = "workflow_dispatch"
          test "$(jq -r .head_branch <<<"${run_json}")" = "main"
          test "$(jq -r .conclusion <<<"${run_json}")" = "success"
          source_sha="$(jq -r .head_sha <<<"${run_json}")"
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "${source_sha}" != "${current_main_sha}" ]]; then
            echo "Plan commit ${source_sha} is stale; current main is ${current_main_sha}" >&2
            exit 1
          fi
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - name: Download saved plan
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          gh run download "${PLAN_RUN_ID}" \
            --name "terraform-${DEPLOY_ENVIRONMENT}-plan-${PLAN_RUN_ID}" \
            --dir "${GITHUB_WORKSPACE}/plan-artifact"
          expected_sha="$(cat plan-artifact/commit.sha)"
          test "${expected_sha}" = "${{ steps.source.outputs.sha }}"
          test "$(cat plan-artifact/plan.environment)" = "${DEPLOY_ENVIRONMENT}"
          expected_kind="apply"
          if [[ "${OPERATION}" == "destroy-apply" ]]; then
            expected_kind="destroy"
          fi
          actual_kind="$(cat plan-artifact/plan.kind)"
          if [[ "${actual_kind}" != "${expected_kind}" ]]; then
            echo "Requested ${expected_kind} but run ${PLAN_RUN_ID} contains a ${actual_kind} plan" >&2
            exit 1
          fi
          sed "s#${TF_ROOT}/tfplan#plan-artifact/${TF_ROOT}/tfplan#" \
            plan-artifact/tfplan.sha256 | sha256sum --check --strict
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.16.1, terraform_wrapper: false}
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-${{ inputs.environment }}-apply
      - name: Materialize environment variables
        env:
          TERRAFORM_TFVARS: ${{ secrets.TERRAFORM_TFVARS }}
        run: |
          test -n "${TERRAFORM_TFVARS}"
          printf '%s\n' "${TERRAFORM_TFVARS}" > "${TF_ROOT}/terraform.tfvars"
          chmod 600 "${TF_ROOT}/terraform.tfvars"
      - name: Initialize remote state
        run: |
          terraform -chdir="${TF_ROOT}" init -reconfigure -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Apply reviewed saved plan
        run: |
          terraform -chdir="${TF_ROOT}" apply -input=false \
            "${GITHUB_WORKSPACE}/plan-artifact/${TF_ROOT}/tfplan"
      - name: Show non-sensitive outputs
        run: terraform -chdir="${TF_ROOT}" output -no-color
      - name: Publish stable Global Accelerator address to DuckDNS
        if: inputs.operation == 'apply'
        env:
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        run: |
          set -Eeuo pipefail
          case "${DEPLOY_ENVIRONMENT}" in
            dev) subdomain=fred-rag-dev ;;
            staging) subdomain=fred-rag-stage ;;
            prod) subdomain=fred-rag ;;
            *) echo "Unsupported environment: ${DEPLOY_ENVIRONMENT}" >&2; exit 2 ;;
          esac
          test -n "${DUCKDNS_TOKEN}"
          echo "::add-mask::${DUCKDNS_TOKEN}"
          duckdns_ip=$(terraform -chdir="${TF_ROOT}" output -raw duckdns_ipv4)
          DUCKDNS_TOKEN="${DUCKDNS_TOKEN}" scripts/update_duckdns.sh \
            "${subdomain}" "${duckdns_ip}"
