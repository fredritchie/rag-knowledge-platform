name: terraform-dev-deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create a plan or apply a plan from a successful earlier run
        type: choice
        options:
          - plan
          - apply
        default: plan
        required: true
      plan_run_id:
        description: Successful plan workflow run ID (required only for apply)
        type: string
        required: false

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ROOT: terraform/environments/dev
  TF_STATE_KEY: environments/dev/terraform.tfstate

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'plan'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.16.1, terraform_wrapper: false}
      - uses: terraform-linters/setup-tflint@v5
        with: {tflint_version: v0.58.1}
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-dev-plan

      - name: Validate dispatch and AWS identity
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${{ vars.AWS_REGION }}" = "ap-south-1"
          aws sts get-caller-identity
      - name: Initialize remote state
        run: |
          terraform -chdir="${TF_ROOT}" init -reconfigure -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Format and validate
        run: |
          terraform fmt -check -recursive terraform
          terraform -chdir="${TF_ROOT}" validate
          tflint --recursive
      - name: Checkov
        run: |
          python -m pip install checkov==3.3.16
          checkov -d terraform --framework terraform --compact
      - name: Create saved plan
        run: |
          terraform -chdir="${TF_ROOT}" plan -input=false -lock-timeout=5m -out=tfplan
          terraform -chdir="${TF_ROOT}" show -no-color tfplan > "${GITHUB_WORKSPACE}/plan.txt"
          sha256sum "${TF_ROOT}/tfplan" > "${GITHUB_WORKSPACE}/tfplan.sha256"
          printf '%s\n' "${GITHUB_SHA}" > "${GITHUB_WORKSPACE}/commit.sha"
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan-${{ github.run_id }}
          path: |
            terraform/environments/dev/tfplan
            plan.txt
            tfplan.sha256
            commit.sha
          if-no-files-found: error
          retention-days: 5

  apply:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'apply'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Verify source plan run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          if [[ ! "${PLAN_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "plan_run_id must be the numeric ID of a successful plan run" >&2
            exit 1
          fi
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}")"
          test "$(jq -r .path <<<"${run_json}")" = ".github/workflows/terraform-deploy.yml"
          test "$(jq -r .event <<<"${run_json}")" = "workflow_dispatch"
          test "$(jq -r .head_branch <<<"${run_json}")" = "main"
          test "$(jq -r .conclusion <<<"${run_json}")" = "success"
          source_sha="$(jq -r .head_sha <<<"${run_json}")"
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "${source_sha}" != "${current_main_sha}" ]]; then
            echo "Plan commit ${source_sha} is stale; current main is ${current_main_sha}" >&2
            exit 1
          fi
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - name: Download saved plan
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          gh run download "${PLAN_RUN_ID}" \
            --name "terraform-dev-plan-${PLAN_RUN_ID}" \
            --dir "${GITHUB_WORKSPACE}/plan-artifact"
          expected_sha="$(cat plan-artifact/commit.sha)"
          test "${expected_sha}" = "${{ steps.source.outputs.sha }}"
          sed "s#${TF_ROOT}/tfplan#plan-artifact/terraform/environments/dev/tfplan#" \
            plan-artifact/tfplan.sha256 | sha256sum --check --strict
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.16.1, terraform_wrapper: false}
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-dev-apply
      - name: Initialize remote state
        run: |
          terraform -chdir="${TF_ROOT}" init -reconfigure -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Apply reviewed saved plan
        run: |
          terraform -chdir="${TF_ROOT}" apply -input=false \
            "${GITHUB_WORKSPACE}/plan-artifact/terraform/environments/dev/tfplan"
      - name: Show non-sensitive outputs
        run: terraform -chdir="${TF_ROOT}" output -no-color
