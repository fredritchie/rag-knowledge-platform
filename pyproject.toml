[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "production-rag-knowledge-platform"
version = "0.1.0"
description = "Configurable production-oriented retrieval-augmented generation platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Fredrick Ritchie"}]
dependencies = [
  "pymupdf==1.26.4",
  "pydantic==2.11.7",
  "typer==0.16.1",
  "rich==14.1.0",
  "pyyaml==6.0.2",
  "httpx==0.28.1",
  "qdrant-client==1.15.1",
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "uvicorn==0.35.0",
  "sqlalchemy[asyncio]==2.0.43",
  "asyncpg==0.30.0",
  "aiosqlite==0.21.0",
  "alembic==1.16.5",
  "pyjwt[crypto]==2.13.0",
  "boto3==1.40.20",
]

[project.optional-dependencies]
ml = [
  "sentence-transformers==5.1.0",
]
dev = [
  "pytest==9.1.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
]

[project.scripts]
ragctl = "rag_platform.cli:app"
rag-api = "rag_platform.api.main:run"
rag-ingestion-worker = "rag_platform.workers.ingestion:run"
rag-sync-worker = "rag_platform.workers.sync:run"
rag-s3-event-worker = "rag_platform.workers.s3_events:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: tests that intentionally create large documents",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/rag_platform/api/**/*.py" = ["B008"]
