[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production-rag-knowledge-platform"
version = "0.1.0"
description = "Configurable production-oriented retrieval-augmented generation platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Fredrick Ritchie"}]
dependencies = [
  "pymupdf>=1.24,<2",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13,<16",
  "pyyaml>=6,<7",
  "httpx>=0.27,<1",
  "qdrant-client>=1.11,<2",
  "fastapi>=0.112,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "pyjwt[crypto]>=2.9,<3",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=3,<6",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
ragctl = "rag_platform.cli:app"
rag-api = "rag_platform.api.main:run"
rag-ingestion-worker = "rag_platform.workers.ingestion:run"
rag-sync-worker = "rag_platform.workers.sync:run"
rag-s3-event-worker = "rag_platform.workers.s3_events:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: tests that intentionally create large documents",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/rag_platform/api/**/*.py" = ["B008"]
