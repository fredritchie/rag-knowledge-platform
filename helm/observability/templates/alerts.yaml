{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rag-platform
  labels: {app.kubernetes.io/name: rag-platform}
spec:
  groups:
    - name: rag-platform.application
      rules:
        - alert: RAGHighErrorRate
          expr: sum(rate(rag_application_errors_total[5m])) > 0.1
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: RAG application error rate is elevated
            description: More than 0.1 application errors per second were observed for ten minutes.
        - alert: RAGP95LatencyHigh
          expr: histogram_quantile(0.95, sum by (le) (rate(rag_stage_duration_seconds_bucket{stage="end_to_end"}[5m]))) > 10
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: RAG p95 latency exceeds ten seconds
            description: End-to-end RAG p95 latency has exceeded ten seconds for fifteen minutes.
        - alert: IngestionFailures
          expr: sum(increase(rag_ingestion_documents_total{outcome="failed"}[15m])) > 0
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: Document ingestion is failing
            description: At least one document failed ingestion during the last fifteen minutes.
        - alert: DriveSyncStale
          expr: time() - max(rag_drive_sync_last_success_unixtime) > 3600
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: Google Drive synchronization is stale
            description: No successful Drive sync has completed in more than one hour.
        - alert: GPUTooHot
          expr: max(DCGM_FI_DEV_GPU_TEMP) > 85
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: GPU temperature is above 85 C
            description: A GPU has remained above the safe temperature threshold for ten minutes.
{{- end }}
