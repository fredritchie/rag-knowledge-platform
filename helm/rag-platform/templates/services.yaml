{{- range $service := list (dict "name" "frontend" "port" 3000) (dict "name" "api" "port" 8080) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag-platform.fullname" $ }}-{{ $service.name }}
spec:
  selector: {app.kubernetes.io/name: rag-platform, app.kubernetes.io/component: {{ $service.name }}}
  ports:
    - {name: http, port: {{ $service.port }}, targetPort: http}
{{- end }}

