{{- range $service := list (dict "name" "frontend" "port" 3000) (dict "name" "api" "port" 8080) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag-platform.fullname" $ }}-{{ $service.name }}
  labels: {app.kubernetes.io/name: rag-platform, app.kubernetes.io/component: {{ $service.name }}}
spec:
  selector: {app.kubernetes.io/name: rag-platform, app.kubernetes.io/component: {{ $service.name }}}
  ports:
    - {name: http, port: {{ $service.port }}, targetPort: http}
    {{- if and (eq $service.name "api") $.Values.observability.enabled }}
    - {name: metrics, port: {{ $.Values.observability.metricsPort }}, targetPort: metrics}
    {{- end }}
{{- end }}

{{- if .Values.observability.enabled }}
{{- range $component := list "ingestion-worker" "drive-sync" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag-platform.fullname" $ }}-{{ $component }}-metrics
  labels: {app.kubernetes.io/name: rag-platform, app.kubernetes.io/component: {{ $component }}}
spec:
  selector: {app.kubernetes.io/name: rag-platform, app.kubernetes.io/component: {{ $component }}}
  ports:
    - {name: metrics, port: {{ $.Values.observability.metricsPort }}, targetPort: metrics}
{{- end }}
{{- end }}
