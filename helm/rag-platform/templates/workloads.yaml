{{- $root := . -}}
{{- $workloads := list
  (dict "name" "frontend" "image" "frontend" "replicas" .Values.replicaCount.frontend "port" 3000 "command" (list) "probe" "/" "pool" "general")
  (dict "name" "api" "image" "api" "replicas" .Values.replicaCount.api "port" 8080 "command" (list "rag-api") "probe" "/live" "pool" "general")
  (dict "name" "ingestion-worker" "image" "ingestionWorker" "replicas" .Values.replicaCount.ingestionWorker "port" 0 "command" (list "rag-s3-event-worker") "probe" "" "pool" "ingestion")
  (dict "name" "drive-sync" "image" "driveSync" "replicas" .Values.replicaCount.driveSync "port" 0 "command" (list "rag-sync-worker") "probe" "" "pool" "general")
-}}
{{- range $workload := $workloads }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-platform.fullname" $root }}-{{ $workload.name }}
  labels: {app.kubernetes.io/name: rag-platform, app.kubernetes.io/component: {{ $workload.name }}}
spec:
  replicas: {{ $workload.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: rag-platform, app.kubernetes.io/component: {{ $workload.name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rag-platform, app.kubernetes.io/component: {{ $workload.name }}}
    spec:
      serviceAccountName: {{ if or (eq $workload.name "ingestion-worker") (eq $workload.name "drive-sync") }}{{ $root.Values.workerServiceAccount.name }}{{ else }}{{ include "rag-platform.serviceAccountName" $root }}{{ end }}
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml (index $root.Values.scheduling $workload.pool).nodeSelector | nindent 8 }}
      {{- with (index $root.Values.scheduling $workload.pool).tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values: [{{ $workload.pool }}]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: rag-platform, app.kubernetes.io/component: {{ $workload.name }}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: rag-platform, app.kubernetes.io/component: {{ $workload.name }}}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ if eq $workload.name "frontend" }}1000{{ else }}10001{{ end }}
        runAsGroup: {{ if eq $workload.name "frontend" }}1000{{ else }}10001{{ end }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $workload.name }}
          image: {{ include "rag-platform.image" (dict "Values" $root.Values "image" $workload.image) }}
          imagePullPolicy: IfNotPresent
          {{- if $workload.command }}
          command: {{ toJson $workload.command }}
          {{- end }}
          env:
            {{- if ne $workload.name "frontend" }}
            - {name: RAG__API__HOST, value: "0.0.0.0"}
            - {name: RAG__QDRANT__URL, value: {{ $root.Values.config.qdrantUrl | quote }}}
            - {name: RAG__GENERATION__BASE_URL, value: {{ $root.Values.config.ollamaUrl | quote }}}
            - {name: AWS_REGION, value: {{ $root.Values.config.awsRegion | quote }}}
            - {name: RAG__EVENT_INGESTION__QUEUE_URL, value: {{ $root.Values.config.ingestionQueueUrl | quote }}}
            - {name: RAG__OBSERVABILITY__ENABLED, value: {{ $root.Values.observability.enabled | quote }}}
            - {name: RAG__OBSERVABILITY__SERVICE_NAME, value: {{ $workload.name | quote }}}
            - {name: RAG__OBSERVABILITY__METRICS_PORT, value: {{ $root.Values.observability.metricsPort | quote }}}
            - {name: RAG__OBSERVABILITY__OTLP_TRACES_ENDPOINT, value: {{ $root.Values.observability.otlpTracesEndpoint | quote }}}
            - {name: RAG__OBSERVABILITY__TRACE_SAMPLE_RATIO, value: {{ $root.Values.observability.traceSampleRatio | quote }}}
            - {name: RAG__DRIVE__ENABLED, value: {{ if eq $workload.name "drive-sync" }}"true"{{ else }}"false"{{ end }}}
            - name: RAG__DATABASE__URL
              valueFrom:
                secretKeyRef: {name: {{ $root.Values.secret.name }}, key: {{ $root.Values.secret.databaseUrlKey }}}
            {{- else }}
            - {name: RAG_API_URL, value: {{ $root.Values.config.apiUrl | quote }}}
            - {name: NEXT_PUBLIC_APP_URL, value: {{ $root.Values.config.appUrl | quote }}}
            {{- end }}
          {{- if gt (int $workload.port) 0 }}
          ports:
            - {name: http, containerPort: {{ $workload.port }}}
            {{- if and (ne $workload.name "frontend") $root.Values.observability.enabled }}
            - {name: metrics, containerPort: {{ $root.Values.observability.metricsPort }}}
            {{- end }}
          {{- else if and (ne $workload.name "frontend") $root.Values.observability.enabled }}
          ports:
            - {name: metrics, containerPort: {{ $root.Values.observability.metricsPort }}}
          {{- end }}
          {{- if $workload.probe }}
          livenessProbe:
            httpGet: {path: {{ $workload.probe }}, port: http}
            initialDelaySeconds: 15
          readinessProbe:
            httpGet: {path: {{ if eq $workload.name "api" }}/ready{{ else }}{{ $workload.probe }}{{ end }}, port: http}
            initialDelaySeconds: 10
          {{- end }}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if ne $workload.name "frontend" }}
            - {name: data, mountPath: /var/lib/rag}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        {{- if ne $workload.name "frontend" }}
        - name: data
          emptyDir: {sizeLimit: 1Gi}
        {{- end }}
{{- end }}
