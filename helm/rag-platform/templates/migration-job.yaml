apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rag-platform.fullname" . }}-migrate
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {app.kubernetes.io/name: rag-platform, app.kubernetes.io/component: migrate}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "rag-platform.serviceAccountName" . }}
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.scheduling.general.nodeSelector | nindent 8 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: workload, operator: In, values: [general]}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: {{ include "rag-platform.image" (dict "Values" .Values "image" "api") }}
          imagePullPolicy: IfNotPresent
          command: [alembic, upgrade, head]
          env:
            - name: RAG__DATABASE__URL
              valueFrom:
                secretKeyRef: {name: {{ .Values.secret.name }}, key: {{ .Values.secret.databaseUrlKey }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
