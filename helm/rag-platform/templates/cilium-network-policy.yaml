{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.ciliumFqdnEgress.enabled }}
# Observe cluster DNS responses so toFQDNs rules learn their allowed IPs.
# This permits DNS lookups only; HTTPS destinations remain separately restricted.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: application-dns-visibility
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: rag-platform
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [frontend, api, ingestion-worker, drive-sync, migrate]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: frontend-cognito-egress
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/component: frontend}
  egress:
    - toFQDNs:
        {{- range .Values.networkPolicy.ciliumFqdnEgress.frontendHosts }}
        - matchName: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: api-cognito-egress
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/component: api}
  egress:
    - toFQDNs:
        {{- range .Values.networkPolicy.ciliumFqdnEgress.apiHosts }}
        - matchName: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: workers-fqdn-egress
spec:
  endpointSelector:
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [ingestion-worker, drive-sync]}
  egress:
    - toFQDNs:
        {{- range .Values.networkPolicy.ciliumFqdnEgress.workerHosts }}
        - matchPattern: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
{{- if .Values.networkPolicy.ciliumFqdnEgress.postgresqlHost }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: database-fqdn-egress
spec:
  endpointSelector:
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [api, ingestion-worker, drive-sync, migrate]}
  egress:
    - toFQDNs:
        - matchName: {{ .Values.networkPolicy.ciliumFqdnEgress.postgresqlHost | quote }}
      toPorts:
        - ports: [{port: "5432", protocol: TCP}]
{{- end }}
---
# Cilium assigns the node-local Pod Identity endpoint the host identity, so the
# Kubernetes NetworkPolicy ipBlock allow rule alone does not grant access.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: application-to-pod-identity-agent
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: rag-platform
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - api
          - ingestion-worker
          - drive-sync
  egress:
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
{{- end }}
