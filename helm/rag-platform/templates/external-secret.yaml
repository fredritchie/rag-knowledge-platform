{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecrets.secretStoreName }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.config.awsRegion }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "rag-platform.fullname" . }}-runtime
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ .Values.secret.name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Helm escaping leaves these expressions for External Secrets Operator.
        database-url: {{ printf "postgresql+asyncpg://{{ .username }}:{{ .password | urlquery }}@{{ .host }}:{{ .port }}/{{ .dbname }}" | quote }}
  data:
    {{- range $property := list "username" "password" "host" "port" "dbname" }}
    - secretKey: {{ $property }}
      remoteRef:
        key: {{ required "externalSecrets.databaseSecretArn is required when externalSecrets is enabled" $.Values.externalSecrets.databaseSecretArn }}
        property: {{ $property }}
    {{- end }}
{{- end }}
