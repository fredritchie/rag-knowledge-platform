{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecrets.secretStoreName }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.config.awsRegion }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "rag-platform.fullname" . }}-runtime
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ .Values.secret.name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "externalSecrets.runtimeSecretArn is required when externalSecrets is enabled" .Values.externalSecrets.runtimeSecretArn }}
{{- if .Values.externalSecrets.databaseSecretArn }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "rag-platform.fullname" . }}-aurora
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ include "rag-platform.fullname" . }}-aurora
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.databaseSecretArn }}
{{- end }}
{{- end }}
