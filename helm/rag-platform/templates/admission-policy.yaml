{{- if .Values.admissionPolicy.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ include "rag-platform.fullname" . }}-verify-images
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: verify-rag-image-signatures
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences: [{{ .Values.admissionPolicy.imagePattern | quote }}]
          mutateDigest: false
          verifyDigest: true
          required: true
          imageRegistryCredentials:
            providers:
              {{- toYaml .Values.admissionPolicy.registryCredentialProviders | nindent 14 }}
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: {{ .Values.admissionPolicy.certificateIdentity | quote }}
                    issuer: {{ .Values.admissionPolicy.certificateIssuer | quote }}
                    rekor:
                      url: {{ .Values.admissionPolicy.rekorUrl | quote }}
{{- end }}
