deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index: {prefix: loki_index_, period: 24h}
  storage:
    type: s3
    bucketNames:
      chunks: replace-with-telemetry-bucket
      ruler: replace-with-telemetry-bucket
      admin: replace-with-telemetry-bucket
    s3:
      region: us-east-1
  limits_config:
    retention_period: 720h
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: s3

serviceAccount:
  create: true
  name: loki
  automountServiceAccountToken: true

rbac:
  namespaced: true

singleBinary:
  replicas: 1
  nodeSelector: {workload: general}
  persistence:
    enabled: true
    size: 20Gi

read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
gateway:
  enabled: true
  service: {type: ClusterIP}
